; Copy this file to config.ini and edit. Every setting is optional;
; the defaults are what the bridge ships with.

[bridge]
; Where the Lua export script sends telemetry (must match the Lua file).
udp_host = 127.0.0.1
udp_port = 41231
; Web console (--web): bind address and port. 0.0.0.0 makes it reachable
; from other devices on the LAN (no authentication - trusted LAN only).
web_host = 0.0.0.0
web_port = 41232
; bHaptics Player websocket endpoint (SDK1).
player_host = 127.0.0.1
player_port = 15881
app_id = dcs_bhaptics_bridge
app_name = DCS bHaptics Bridge
; Global intensity multiplier, 0.0 - 1.0.
master_scale = 1.0
; Set true if the vest's rows feel upside down (G pulling the wrong way).
flip_vertical = false

[effects]
; Stall buffet starts at this angle of attack, in radians (~17 deg = 0.30).
stall_aoa = 0.30
; Positive-G squeeze: starts at g_onset, reaches full at g_full.
; The feel starts in the lower rows and climbs the vest as G builds;
; flight below g_onset (ordinary turns) stays silent.
g_onset = 2.00
g_full = 6.50
; Negative-G feel starts below this load factor.
neg_g_onset = 0.20

; Per-effect switches: true / false.
effect_g = true
effect_burner = true
effect_stall = true
effect_gear = true
effect_touchdown = true
effect_release = true
effect_gun = true
effect_cm = true
effect_damage = true
effect_taxi = true
