; Copy this file to config.ini and edit. Every setting is optional;
; the defaults are what the bridge ships with.

[bridge]
; Where the Lua export script sends telemetry (must match the Lua file).
udp_host = 127.0.0.1
udp_port = 41231
; Web console (--web): bind address and port. 0.0.0.0 makes it reachable
; from other devices on the LAN (no authentication - trusted LAN only).
web_host = 0.0.0.0
web_port = 41232
; bHaptics Player websocket endpoint (SDK1).
player_host = 127.0.0.1
player_port = 15881
app_id = dcs_bhaptics_bridge
app_name = DCS bHaptics Bridge
; Player transport: sdk2 (default) uses the official bhaptics-python
; package - "pip install bhaptics-python" - and addresses the motors
; directly; the console can show real vest status. sdk1 is the
; legacy built-in client: no package, but motors go
; through the grid translation described in the README.
transport = sdk2
; Global intensity multiplier, 0.0 - 1.0.
master_scale = 1.0

[effects]
; Stall buffet starts at this angle of attack, in radians (~17 deg = 0.30).
stall_aoa = 0.30
; Positive-G squeeze: 1 G is the neutral point and stays silent;
; above g_onset the squeeze grows continuously with the load,
; starting in the lower rows and climbing the vest to full at
; g_full.
g_onset = 1.20
g_full = 6.50
; Unload (negative-G) feel: below neg_g_onset the chest feel
; builds continuously as the load drops, full at about -1 G.
neg_g_onset = 0.85

; Per-effect switches: true / false.
effect_g = true
effect_burner = true
effect_stall = true
effect_gear = true
effect_touchdown = true
effect_release = true
effect_gun = true
effect_cm = true
effect_damage = true
effect_taxi = true
